<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para vos 💙</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; background: #01040f; overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none; -webkit-tap-highlight-color: transparent;
      touch-action: none; cursor: grab;
    }
    body:active { cursor: grabbing; }
    canvas { display: block; position: fixed; top: 0; left: 0; z-index: 1; }
    #ui {
      position: fixed; inset: 0; z-index: 2; pointer-events: none;
      display: flex; flex-direction: column; justify-content: space-between;
      align-items: center; padding: 4.5vh 24px 4.5vh;
    }
    #texto-frase {
      color: #f0f9ff; font-size: clamp(1.15rem, 3vw, 1.85rem); text-align: center;
      max-width: 820px; line-height: 1.4;
      text-shadow: 0 0 16px rgba(56,189,248,1), 0 0 35px rgba(37,99,235,0.9);
      opacity: 1; transform: translateY(0) scale(1);
      transition: opacity 3.8s ease-in-out, transform 3.8s ease-in-out;
    }
    #aviso-toque {
      color: #93c5fd; font-size: clamp(0.88rem, 2.2vw, 1.05rem); letter-spacing: 0.8px;
      text-align: center;
      text-shadow: 0 0 12px rgba(59,130,246,0.95);
      animation: latidoTexto 3.5s infinite ease-in-out;
      transition: opacity 2s ease;
    }
    .frase-esquina {
      position: fixed; z-index: 2; pointer-events: none;
      color: #bae6fd; font-size: clamp(0.85rem, 2vw, 1.1rem);
      font-style: italic; letter-spacing: 0.8px;
      text-shadow: 0 0 12px rgba(56,189,248,0.95), 0 0 24px rgba(37,99,235,0.85);
      opacity: 0; transform: scale(0.95);
      transition: opacity 3s ease-in-out, transform 3s ease-in-out;
    }
    .frase-esquina.visible { opacity: 0.9; transform: scale(1); }
    .oculto { opacity: 0 !important; transform: translateY(14px) scale(0.96) !important; }

    #tarjeta-final {
      position: fixed; top: 52%; left: 50%; transform: translate(-50%, -50%) scale(0.9);
      z-index: 3; width: 88%; max-width: 440px; padding: 28px 24px;
      background: rgba(10, 18, 38, 0.85); backdrop-filter: blur(12px);
      border: 1px solid rgba(56, 189, 248, 0.5); border-radius: 20px;
      box-shadow: 0 0 45px rgba(37, 99, 235, 0.55);
      text-align: center; color: #f0f9ff;
      opacity: 0; pointer-events: none;
      transition: opacity 2.2s ease, transform 2.2s ease;
    }
    #tarjeta-final.activa { opacity: 1; transform: translate(-50%, -50%) scale(1); pointer-events: auto; }
    #tarjeta-final h2 { font-size: 1.35rem; font-weight: 500; margin-bottom: 10px; color: #7dd3fc; }
    #tarjeta-final p { font-size: 1rem; line-height: 1.5; color: #e0f2fe; margin-bottom: 16px; }
    #tarjeta-final span { display: inline-block; font-size: 0.85rem; color: #93c5fd; border-top: 1px solid rgba(147,197,253,0.25); padding-top: 10px; }

    @keyframes latidoTexto {
      0%, 100% { opacity: 0.35; transform: scale(0.98); }
      50% { opacity: 1; transform: scale(1.03); }
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="ui">
    <p id="texto-frase">Toca la pantalla para empezar...</p>
    <p id="aviso-toque">✨ Toca la pantalla (y desliza para girar en 3D) ✨</p>
  </div>
  <div id="esquina" class="frase-esquina"></div>

  <div id="tarjeta-final">
    <h2>Vale por una cita juntos 💙</h2>
    <p>Elegí la película o el lugar que más ganas tengas de ir, yo me encargo del resto.</p>
    <span>Válido cuando vos quieras ✨</span>
  </div>

  <audio id="musica" loop preload="auto"><source src="cancion.mp3" type="audio/mpeg"></audio>
  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const elFrase = document.getElementById("texto-frase");
    const elAviso = document.getElementById("aviso-toque");
    const elEsquina = document.getElementById("esquina");
    const elTarjeta = document.getElementById("tarjeta-final");
    const musica = document.getElementById("musica");

    let W = canvas.width = window.innerWidth;
    let H = canvas.height = window.innerHeight;
    const COLORS = ["#38bdf8", "#60a5fa", "#93c5fd", "#3b82f6", "#e0f2fe"];

    const ESCENAS = [
      { texto: "No sabía lo que me faltaba hasta que llegaste vos.", forma: "esfera", auto: true, ms: 24000 },
      { texto: "Me enseñaste a querer de una forma que no conocía.", forma: "corazon3d", auto: false },
      { texto: "Con vos entendí que el hogar no es un lugar, es una persona.", forma: "toroide", auto: true, ms: 25000 },
      { texto: "Mirarte es confirmar que todo valió la pena.", forma: "adn", auto: false },
      { texto: "Gracias por hacerme sentir que todo va a estar bien.", forma: "atomo", auto: true, ms: 24000 },
      { texto: "Gracias por estar conmigo, por cuidarme y por ser vos.", forma: "flor3d", auto: false },
      { texto: "Siempre vas a ser mi elección.", forma: "galaxia3d", auto: true, ms: 25000 },
      { texto: "Sos lo más lindo que me pasó en la vida.", forma: "estrella3d", auto: true, ms: 24000 },
      { texto: "Te amo hoy, mañana y en todas las vidas que vengan.", forma: "corazon3d", auto: false, esFinal: true }
    ];

    const SUSURROS = [
      "te amo 💙", "sos mi paz", "siempre vos", "mi lugar favorito",
      "gracias por existir", "sos todo lo que está bien", "me encantás", "mi persona favorita"
    ];

    let escenaActual = -1, iniciado = false, esperandoToque = true, sorpresaMostrada = false;
    let fase = "libre", timerEscena = null, timerFase = null, timerFrase = null, tiempo = 0;
    let indiceSusurro = 0, ultimaEsquina = -1;

    // Variables de rotación 3D interactiva
    let rotX = 0.2, rotY = 0;
    let velRotX = 0, velRotY = 0.0035;
    let arrastrando = false, inicioX = 0, inicioY = 0, prevX = 0, prevY = 0;

    function generarPuntos3D(tipo, cantidad) {
      const pts = [];
      const R = Math.min(W, H) * 0.34;

      for (let i = 0; i < cantidad; i++) {
        const u = i / cantidad;
        const phi = Math.acos(1 - 2 * ((i + 0.5) / cantidad));
        const theta = Math.PI * (1 + Math.sqrt(5)) * i;
        let x = 0, y = 0, z = 0;

        if (tipo === "corazon3d") {
          // Corazón volumétrico 3D
          const t = (i % 120) / 120 * Math.PI * 2;
          const capa = Math.floor(i / 120) / Math.ceil(cantidad / 120);
          const angZ = (capa - 0.5) * Math.PI;
          const grosor = Math.cos(angZ);
          const s = R * 0.068;
          x = 16 * Math.pow(Math.sin(t), 3) * s * grosor;
          y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * s * grosor;
          z = Math.sin(angZ) * (R * 0.45) * (1 - Math.abs(Math.cos(t)) * 0.3);
        } else if (tipo === "toroide") {
          // Dona / anillo 3D
          const a = u * Math.PI * 2 * 12;
          const b = u * Math.PI * 2;
          const R1 = R * 0.78, R2 = R * 0.34;
          x = (R1 + R2 * Math.cos(a)) * Math.cos(b);
          y = R2 * Math.sin(a);
          z = (R1 + R2 * Math.cos(a)) * Math.sin(b);
        } else if (tipo === "adn") {
          // Doble hélice 3D vertical
          const h = (u - 0.5) * R * 2.1;
          const ang = u * Math.PI * 6 + (i % 2 === 0 ? 0 : Math.PI);
          const rad = R * 0.48;
          x = Math.cos(ang) * rad;
          y = h;
          z = Math.sin(ang) * rad;
        } else if (tipo === "atomo") {
          // Tres órbitas inclinadas en 3D
          const orbita = i % 3;
          const ang = u * Math.PI * 2 * 3;
          const ox = Math.cos(ang) * R * 0.95;
          const oz = Math.sin(ang) * R * 0.95;
          const inc = (orbita * Math.PI) / 3;
          x = ox * Math.cos(inc);
          y = ox * Math.sin(inc);
          z = oz;
        } else if (tipo === "flor3d") {
          // Rosa esférica 3D
          const r = R * (0.55 + 0.45 * Math.sin(5 * theta) * Math.sin(phi));
          x = r * Math.sin(phi) * Math.cos(theta);
          y = r * Math.cos(phi);
          z = r * Math.sin(phi) * Math.sin(theta);
        } else if (tipo === "estrella3d") {
          const r = R * (0.5 + 0.5 * Math.cos(5 * phi) * Math.cos(5 * theta));
          x = r * Math.sin(phi) * Math.cos(theta);
          y = r * Math.cos(phi);
          z = r * Math.sin(phi) * Math.sin(theta);
        } else if (tipo === "galaxia3d") {
          const brazo = i % 4;
          const dist = Math.pow(u, 0.7) * R * 1.15;
          const ang = dist * 0.025 + (brazo * Math.PI) / 2;
          x = Math.cos(ang) * dist;
          y = (Math.random() - 0.5) * (R * 0.25) * (1 - u);
          z = Math.sin(ang) * dist;
        } else {
          // Esfera luminosa 3D
          x = R * Math.sin(phi) * Math.cos(theta);
          y = R * Math.cos(phi);
          z = R * Math.sin(phi) * Math.sin(theta);
        }
        pts.push({ x, y, z });
      }
      return pts;
    }

    class Particle3D {
      constructor() {
        this.x = (Math.random() - 0.5) * W;
        this.y = (Math.random() - 0.5) * H;
        this.z = (Math.random() - 0.5) * 500;
        this.tx = this.x; this.ty = this.y; this.tz = this.z;
        this.vx = (Math.random() - 0.5) * 0.3;
        this.vy = (Math.random() - 0.5) * 0.3;
        this.vz = (Math.random() - 0.5) * 0.3;
        this.angle = Math.random() * Math.PI * 2;
        this.size = Math.random() * 2.5 + 1.5;
        this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
      }
      update(estado) {
        if (estado === "formando") {
          this.vx = this.vx * 0.98 + (this.tx - this.x) * 0.0011;
          this.vy = this.vy * 0.98 + (this.ty - this.y) * 0.0011;
          this.vz = this.vz * 0.98 + (this.tz - this.z) * 0.0011;
          this.x += this.vx; this.y += this.vy; this.z += this.vz;
        } else {
          this.angle += 0.012;
          this.vx = this.vx * 0.985 + Math.cos(this.angle) * 0.025;
          this.vy = this.vy * 0.985 + Math.sin(this.angle) * 0.025;
          this.vz = this.vz * 0.985 + Math.sin(this.angle * 0.7) * 0.025;
          this.x += this.vx; this.y += this.vy; this.z += this.vz;
          const lim = Math.max(W, H) * 0.45;
          if (Math.abs(this.x) > lim) this.vx *= -1;
          if (Math.abs(this.y) > lim) this.vy *= -1;
          if (Math.abs(this.z) > 350) this.vz *= -1;
        }
      }
    }
    class GiantRing {
      constructor(x, y) { this.x = x; this.y = y; this.r = 10; this.alpha = 0.5; }
      update() { this.r += 3; this.alpha -= 0.0045; }
      draw() {
        if (this.alpha <= 0) return;
        ctx.save(); ctx.globalAlpha = this.alpha; ctx.strokeStyle = "#38bdf8"; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
      }
    }

    class BurstParticle {
      constructor(x, y, vx, vy) {
        this.x = x; this.y = y; this.vx = vx; this.vy = vy;
        this.life = 140; this.maxLife = 140;
        this.size = Math.random() * 2.5 + 1.3;
        this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
      }
      update() { this.vx *= 0.985; this.vy *= 0.985; this.x += this.vx; this.y += this.vy; this.life--; }
      draw() {
        const a = Math.max(0, this.life / this.maxLife);
        ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = this.color;
        ctx.beginPath(); ctx.arc(this.x, this.y, this.size * a + 0.5, 0, Math.PI * 2); ctx.fill(); ctx.restore();
      }
    }

    const particles = Array.from({ length: W < 600 ? 320 : 480 }, () => new Particle3D());
    const bursts = [], rings = [];

    function prepararDestinos(tipo) {
      const destinos = generarPuntos3D(tipo, particles.length);
      particles.forEach((p, i) => {
        p.tx = destinos[i].x; p.ty = destinos[i].y; p.tz = destinos[i].z;
        p.vx += (Math.random() - 0.5) * 1.4;
        p.vy += (Math.random() - 0.5) * 1.4;
        p.vz += (Math.random() - 0.5) * 1.4;
      });
      rings.push(new GiantRing(W / 2, H * 0.53));
    }

    function explotarEn(x, y) {
      const esc = Math.min(W, H) * 0.01;
      for (let i = 0; i < 65; i++) {
        const t = (Math.PI * 2 * i) / 65;
        const vx = 16 * Math.pow(Math.sin(t), 3) * esc * 0.055;
        const vy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * esc * 0.055;
        bursts.push(new BurstParticle(x, y, vx, vy));
      }
      rings.push(new GiantRing(x, y));
    }

    function mostrarSusurroEsquina() {
      if (!iniciado || sorpresaMostrada) return;
      const posiciones = [
        { top: "14vh", left: "6vw", right: "auto", bottom: "auto" },
        { top: "14vh", right: "6vw", left: "auto", bottom: "auto" },
        { bottom: "13vh", left: "6vw", right: "auto", top: "auto" },
        { bottom: "13vh", right: "6vw", left: "auto", top: "auto" }
      ];
      let idxPos = Math.floor(Math.random() * posiciones.length);
      if (idxPos === ultimaEsquina) idxPos = (idxPos + 1) % posiciones.length;
      ultimaEsquina = idxPos;
      const pos = posiciones[idxPos];
      elEsquina.style.top = pos.top; elEsquina.style.bottom = pos.bottom;
      elEsquina.style.left = pos.left; elEsquina.style.right = pos.right;
      elEsquina.textContent = SUSURROS[indiceSusurro];
      indiceSusurro = (indiceSusurro + 1) % SUSURROS.length;
      elEsquina.classList.add("visible");
      setTimeout(() => elEsquina.classList.remove("visible"), 6000);
    }

    setInterval(mostrarSusurroEsquina, 13000);

    function avanzarEscena() {
      clearTimeout(timerEscena); clearTimeout(timerFase); clearTimeout(timerFrase);
      if (escenaActual === ESCENAS.length - 1 && !sorpresaMostrada) {
        sorpresaMostrada = true; elAviso.classList.add("oculto");
        elTarjeta.classList.add("activa"); explotarEn(W / 2, H / 2);
        return;
      }
      if (sorpresaMostrada) { elTarjeta.classList.remove("activa"); sorpresaMostrada = false; }

      escenaActual = (escenaActual + 1) % ESCENAS.length;
      const esc = ESCENAS[escenaActual];
      elFrase.classList.add("oculto"); elAviso.classList.add("oculto");
      fase = "libre"; prepararDestinos(esc.forma);

      timerFase = setTimeout(() => { fase = "formando"; }, 4800);
      timerFrase = setTimeout(() => { elFrase.textContent = esc.texto; elFrase.classList.remove("oculto"); }, 6200);

      if (esc.auto) {
        esperandoToque = false; timerEscena = setTimeout(avanzarEscena, esc.ms);
      } else {
        esperandoToque = true;
        timerEscena = setTimeout(() => {
          elAviso.textContent = esc.esFinal ? "✨ Tengo una última sorpresa... toca la pantalla ✨" : "✨ Toca la pantalla para seguir (desliza para girar) ✨";
          elAviso.classList.remove("oculto");
        }, 14500);
      }
    }

    // Control de toque y deslizamiento 3D
    document.addEventListener("pointerdown", e => {
      arrastrando = true;
      inicioX = prevX = e.clientX;
      inicioY = prevY = e.clientY;
    });

    document.addEventListener("pointermove", e => {
      if (!arrastrando) return;
      const dx = e.clientX - prevX;
      const dy = e.clientY - prevY;
      velRotY = dx * 0.005;
      velRotX = dy * 0.005;
      rotY += velRotY;
      rotX += velRotX;
      prevX = e.clientX;
      prevY = e.clientY;
    });

    document.addEventListener("pointerup", e => {
      arrastrando = false;
      const distanciaArrastre = Math.hypot(e.clientX - inicioX, e.clientY - inicioY);
      // Si fue un toque corto (no un deslizamiento largo), avanza y explota
      if (distanciaArrastre < 12) {
        if (!iniciado) { musica.play().catch(() => {}); iniciado = true; setTimeout(mostrarSusurroEsquina, 5000); }
        explotarEn(e.clientX, e.clientY);
        if (esperandoToque) avanzarEscena();
      }
    });

    window.addEventListener("resize", () => {
      W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight;
      if (iniciado && escenaActual >= 0) prepararDestinos(ESCENAS[escenaActual].forma);
    });

    function animate() {
      tiempo++;
      ctx.fillStyle = "rgba(1, 4, 15, 0.24)";
      ctx.fillRect(0, 0, W, H);

      // Rotación continua ultra lenta + inercia del deslizamiento
      if (!arrastrando) {
        rotY += velRotY;
        rotX += velRotX;
        velRotY = velRotY * 0.96 + 0.003 * 0.04;
        velRotX *= 0.95;
      }

      const cosY = Math.cos(rotY), sinY = Math.sin(rotY);
      const cosX = Math.cos(rotX), sinX = Math.sin(rotX);
      const fov = 650;

      // Proyectar coordenadas 3D a 2D y ordenar de atrás hacia adelante
      const proyectadas = particles.map(p => {
        p.update(fase);
        // Rotar en eje Y
        let x1 = p.x * cosY - p.z * sinY;
        let z1 = p.z * cosY + p.x * sinY;
        // Rotar en eje X
        let y2 = p.y * cosX - z1 * sinX;
        let z2 = z1 * cosX + p.y * sinX;

        const escala = fov / (fov + z2 + 250);
        return {
          sx: W / 2 + x1 * escala,
          sy: H * 0.53 + y2 * escala,
          z: z2,
          escala: Math.max(0.2, escala),
          size: p.size,
          color: p.color
        };
      });

      proyectadas.sort((a, b) => b.z - a.z);

      proyectadas.forEach(pt => {
        const alpha = Math.min(1, Math.max(0.18, pt.escala * 0.95));
        const radio = pt.size * pt.escala;
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.fillStyle = pt.color;
        ctx.shadowBlur = 12 * pt.escala;
        ctx.shadowColor = pt.color;
        ctx.beginPath();
        ctx.arc(pt.sx, pt.sy, radio, 0, Math.PI * 2);
        ctx.fill();
        if (pt.escala > 0.85) {
          ctx.fillStyle = "#ffffff";
          ctx.beginPath();
          ctx.arc(pt.sx, pt.sy, radio * 0.4, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      });

      for (let i = rings.length - 1; i >= 0; i--) { rings[i].update(); rings[i].draw(); if (rings[i].alpha <= 0) rings.splice(i, 1); }
      for (let i = bursts.length - 1; i >= 0; i--) { bursts[i].update(); bursts[i].draw(); if (bursts[i].life <= 0) bursts.splice(i, 1); }

      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
